name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU-only torch)
        # The default PyPI wheel drags ~2GB of CUDA runtime that a CPU runner
        # never uses, so pull torch from the CPU index first.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: pytest -q
      - name: Reproduce the published comparison
        # The README table is generated by this script; if it stops running the
        # numbers in the README are no longer reproducible.
        run: python scripts/run_comparison.py
